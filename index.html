        /* ================= 2. UI 视觉 (V17.6.3 原版样式) ================= */:root {
            --glass-bg: rgba(20, 20, 25, 0.75);
            --glass-border: rgba(255, 255, 255, 0.08);
            --glass-highlight: rgba(255, 255, 255, 0.15);
            --accent-gold: #d4af37;
            --accent-gold-gradient: linear-gradient(135deg, #fceea7 0%, #d4af37 100%);
            --text-main: #ffffff;
            --text-sub: #b0b0b5;
            --panel-width: 210px;
            --ui-scale: 0.9; 
        }

        @media screen and (max-height: 800px) { :root { --ui-scale: 0.8; } }
        @media screen and (min-width: 2000px) { :root { --ui-scale: 1.1; } }
        :fullscreen { --ui-scale: 1.0; }

        .glass-panel {
            background: var(--glass-bg);
            backdrop-filter: blur(40px) saturate(180%);
            -webkit-backdrop-filter: blur(40px) saturate(180%);
            border-radius: 16px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6), inset 0.5px 0.5px 0px var(--glass-highlight), inset -0.5px -0.5px 0px rgba(0,0,0,0.5);
            border: 1px solid var(--glass-border);
            overflow: hidden;
            box-sizing: border-box;
        }

        #left-sidebar, .bottom-left-panel { transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.4s cubic-bezier(0.4, 0, 0.2, 1); }
        .panel-hidden { transform: translateX(calc(-1 * var(--panel-width) - 50px)) scale(var(--ui-scale)) !important; opacity: 0 !important; pointer-events: none !important; }
        .hidden { display: none !important; }

        #left-sidebar { position: absolute; top: 15px; left: 15px; width: var(--panel-width); height: calc(100vh - 30px); display: flex; flex-direction: column; gap: 8px; z-index: 20; pointer-events: none; transform: scale(var(--ui-scale)); transform-origin: top left; }
        .scroll-content { flex: 1; overflow-y: auto; pointer-events: auto; padding: 10px; display: flex; flex-direction: column; gap: 10px; scrollbar-width: none; }
        .scroll-content::-webkit-scrollbar { display: none; }

        .bottom-left-panel { position: absolute; bottom: 15px; left: 15px; pointer-events: auto; display: grid; grid-template-columns: 1fr 1fr; gap: 5px; width: var(--panel-width); padding: 10px; box-sizing: border-box; transform: scale(var(--ui-scale)); transform-origin: bottom left; }
        .bottom-left-panel .ui-title-main { grid-column: span 2; font-size: 11px; margin-bottom: 4px; padding-bottom: 2px; }
        .bottom-left-panel .elegant-btn { width: 100%; font-size: 10px; height: 28px; }

        /* 修复 input file 样式 */.bottom-left-panel .elegant-btn { width: 100%; font-size: 10px; height: 28px; position: relative; }
        .elegant-btn input[type="file"] { position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; }

        .ui-title-main { font-family: 'SimSun', 'Songti SC', serif; font-size: 14px; font-weight: bold; color: #fff1c1; text-shadow: 0 0 10px rgba(212, 175, 55, 0.3); border-bottom: 1px solid rgba(212, 175, 55, 0.2); padding-bottom: 4px; margin-bottom: 6px; letter-spacing: 2px; text-align: center; }
        .ui-title-sub { font-size: 12px; color: #b0b0b5; margin-top: 6px; margin-bottom: 3px; letter-spacing: 1px; font-weight: 700; text-transform: uppercase; }
        .control-label { color: #aaa; font-size: 11px; font-weight: 700; }
        .control-group { display: flex; flex-direction: column; gap: 2px; margin-bottom: 5px; }
        .control-row { display: flex; flex-direction: column; gap: 1px; margin-bottom: 4px; }

        .particle-scroll-container { max-height: 140px; overflow-y: auto; padding-right: 4px; margin-right: -4px; border-left: 2px solid rgba(212,175,55,0.1); padding-left: 6px; }
        .particle-scroll-container::-webkit-scrollbar { width: 3px; }
        .particle-scroll-container::-webkit-scrollbar-track { background: rgba(255,255,255,0.02); border-radius: 2px; }
        .particle-scroll-container::-webkit-scrollbar-thumb { background: rgba(212,175,55,0.4); border-radius: 2px; }

        .elegant-btn { background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(212, 175, 55, 0.3); color: #d4af37; padding: 5px 0; cursor: pointer; text-transform: uppercase; font-size: 10px; transition: all 0.3s ease; display: flex; align-items: center; justify-content: center; border-radius: 4px; box-sizing: border-box; position: relative; overflow: hidden; font-family: 'Microsoft YaHei', sans-serif; text-decoration: none; }
        .elegant-btn:hover { background: rgba(212, 175, 55, 0.1); border-color: #fff1c1; color: #fff; box-shadow: 0 0 15px rgba(212, 175, 55, 0.4); text-shadow: 0 0 5px rgba(255, 255, 255, 0.8); }
        .elegant-btn:active { transform: scale(0.98); }
        .btn-red { border-color: #844; color: #eaa; }
        .btn-red:hover { background: #522; box-shadow: 0 0 15px rgba(255, 50, 50, 0.3); }

        input[type=range] { -webkit-appearance: none; width: 100%; background: transparent; margin: 3px 0; }
        input[type=range]:focus { outline: none; }
        input[type=range]::-webkit-slider-runnable-track { width: 100%; height: 1px; cursor: pointer; background: rgba(255, 255, 255, 0.2); border-radius: 1px; }
        input[type=range]::-webkit-slider-thumb { height: 9px; width: 9px; border-radius: 50%; background: #d4af37; cursor: pointer; -webkit-appearance: none; margin-top: -4px; box-shadow: 0 0 5px rgba(212, 175, 55, 0.8); border: 1px solid #000; transition: transform 0.1s; }
        input[type=range]::-webkit-slider-thumb:hover { transform: scale(1.3); background: #fff; }

        .input-glass { background: rgba(0, 0, 0, 0.3); border: 1px solid rgba(255, 255, 255, 0.1); color: #eebb66; padding: 3px; font-size: 10px; outline: none; transition: 0.3s; border-radius: 2px; width: 100%; box-sizing: border-box; text-align: center; height: 24px; }
        .input-glass:focus { border-color: #d4af37; background: rgba(0,0,0,0.6); }
        select.input-glass { cursor: pointer; }
        select.input-glass option { background: #000; color: #d4af37; }
        input[type="color"] { -webkit-appearance: none; border: none; width: 100%; height: 16px; cursor: pointer; padding: 0; background: none; }

        #ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10; pointer-events: none; }
        #title-container { position: absolute; top: 10%; left: 50%; transform: translateX(-50%); text-align: center; pointer-events: auto; cursor: move; z-index: 50; transition: color 0.2s; user-select: none; padding: 10px; }
        .title-line { margin: 0; transition: all 0.2s ease; white-space: nowrap; color: #fceea7; text-shadow: 0 0 30px rgba(255, 255, 255, 0.2); }
        .top-left-panel { pointer-events: auto; display: flex; flex-direction: column; gap: 4px; padding: 10px; width: 100%; box-sizing: border-box; }
        .interaction-grid { display: flex; gap: 4px; margin-bottom: 4px; }
        .direction-pad { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 3px; margin-top: 6px; padding-top: 6px; border-top: 1px solid rgba(255,255,255,0.05); }
        .dir-btn { background: rgba(255,255,255,0.03); border: 1px solid rgba(212,175,55,0.2); color: #d4af37; text-align: center; cursor: pointer; padding: 5px 0; border-radius: 2px; font-size: 11px; user-select: none; transition: 0.2s; }
        .dir-btn:hover { background: rgba(212,175,55,0.2); color: #fff; box-shadow: 0 0 8px rgba(212,175,55,0.2); }
        .dir-btn:active { background: #d4af37; color: #000; }
        
        #top-right-controls { position: absolute; top: 15px; right: 15px; pointer-events: auto; display: flex; flex-direction: column; gap: 8px; align-items: flex-end; z-index: 50; }
        #webcam-wrapper { position: absolute; bottom: 15px; right: 15px; width: 160px; height: 120px; border: 1px solid rgba(212, 175, 55, 0.5); border-radius: 4px; box-shadow: 0 0 20px rgba(0, 0, 0, 0.9); overflow: hidden; z-index: 20; pointer-events: auto; background: #000; transition: opacity 0.4s ease, transform 0.4s ease; }
        #webcam-wrapper.camera-hidden { opacity: 0; pointer-events: none; transform: translateY(10px); }
        #webcam-canvas { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); display: block; }
        #cam-status { position: absolute; bottom: 5px; right: 5px; width: 6px; height: 6px; background: #550000; border-radius: 50%; box-shadow: 0 0 4px #ff0000; z-index: 30; transition: 0.2s; }
        #cam-status.active { background: #00ff00; box-shadow: 0 0 6px #00ff00; }
        
        #delete-manager { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 60; display: flex; flex-direction: column; align-items: center; justify-content: center; pointer-events: auto; backdrop-filter: blur(10px); }
        #photo-grid { display: flex; flex-wrap: wrap; gap: 15px; width: 70%; height: 60%; overflow-y: auto; justify-content: center; padding: 20px; border: 1px solid rgba(212,175,55,0.3); margin: 20px 0; background: rgba(0,0,0,0.5); border-radius: 8px; }
        .photo-item { width: 80px; height: 80px; position: relative; border: 1px solid #d4af37; transition: 0.2s; cursor: pointer; }
        .photo-item:hover { transform: scale(1.1); border-color: #fff; box-shadow: 0 0 15px rgba(212,175,55,0.5); }
        .photo-thumb { width: 100%; height: 100%; object-fit: cover; }
        .delete-x { position: absolute; top: -8px; right: -8px; width: 20px; height: 20px; background: #900; color: white; border-radius: 50%; text-align: center; line-height: 18px; font-size: 12px; cursor: pointer; font-weight: bold; border: 1px solid #fff; }
        .manager-title { color: #d4af37; font-size: 20px; font-family: 'Microsoft YaHei', serif; letter-spacing: 2px; }
        
        #loader { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #050505; z-index: 100; display: flex; flex-direction: column; align-items: center; justify-content: center; transition: opacity 0.5s ease-out; }
        .spinner { width: 50px; height: 50px; border: 1px solid rgba(212, 175, 55, 0.1); border-top: 2px solid #d4af37; border-radius: 50%; animation: spin 1s cubic-bezier(0.4, 0, 0.2, 1) infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .loader-text { color: #d4af37; font-size: 12px; letter-spacing: 4px; margin-top: 25px; font-family: 'Cinzel', serif; opacity: 0.8; }
        

        /* ================= 4. 摄像头状态 ================= */
        #cam-msg { position: absolute; left: 0; right: 0; bottom: 0; padding: 2px 4px; font-size: 9px; line-height: 1.25;
            color: #f1d78a; background: linear-gradient(transparent, rgba(0,0,0,0.8)); text-align: center; pointer-events: none; }
        .cam-retry { position: absolute; top: 2px; left: 2px; display: none; padding: 2px 7px; font-size: 10px; line-height: 1.4;
            color: #050505; background: #d4af37; border: none; border-radius: 3px; cursor: pointer; z-index: 31; font-family: inherit; }
        .cam-retry.show { display: block; }
        #gesture-hint { position: absolute; bottom: 10px; width: 100%; text-align: center; color: rgba(212,175,55,0.7); font-size: 10px; pointer-events: none; text-shadow: 0 0 5px #000; z-index: 5; }

        /* ================= 3. 移动端适配 (v17.6.5-m) ================= */
        #mobile-bar { display: none; }
        @media (max-width: 760px), (hover: none) and (pointer: coarse) {
            :root { --ui-scale: 1; }
            html, body { overscroll-behavior: none; -webkit-tap-highlight-color: transparent; }
            body { -webkit-user-select: none; user-select: none; }
            #canvas-container { height: 100vh; height: 100dvh; touch-action: none; }
            #title-container { top: 12%; padding: 6px; cursor: default; }
            .title-line { white-space: normal; }

            #top-right-controls { top: calc(6px + env(safe-area-inset-top)); right: 6px; gap: 6px; }
            #top-right-controls .elegant-btn { font-size: 11px !important; min-height: 34px; padding: 4px 10px !important; }

            #left-sidebar {
                position: fixed; left: 6px; right: 6px; bottom: calc(74px + env(safe-area-inset-bottom)); top: auto;

        function pickParticlePositions(tree, loose, isDust = false) {
            const h = CONFIG.particles.treeHeight;
            // The lower crown has more surface area per unit of height.
            const t = 1 - Math.pow(1 - Math.random(), .62);
            const angle = Math.random() * Math.PI * 2;
            const radius = Math.max(.06, CONFIG.particles.treeRadius * (1 - t));
            const r = radius * (Math.random() < .27 ? Math.sqrt(Math.random()) * .86 : .81 + Math.random() * .21);
            tree.set(Math.cos(angle) * r, (t - .5) * h, Math.sin(angle) * r);
            loose.randomDirection().multiplyScalar(isDust ? 12 + Math.random() * 20 : 8 + Math.random() * 14);
            loose.x *= 1.42;
        }

        function createParticles() {
            const green = CONFIG.sceneStyle !== 'gold';

            const beadCount = Math.round(count * (green ? .979 : .91));
            const palette = green ? [0x20aa2d,0x56bf24,0x32b839,0x7bc91d,0xa8df30,0x13802a] : [CONFIG.colors.deepGreen,CONFIG.colors.champagneGold];
            const balls = green ? [0xee284e,0xff659e,0x417ff3,0xf8c849,0xdd3444,0xa778ed] : [CONFIG.colors.champagneGold,CONFIG.colors.accentRed];
            const beadMat = new THREE.MeshStandardMaterial({metalness:green ? .12 : .50, roughness:green ? .42 : .33});
            const ornamentMat = new THREE.MeshStandardMaterial({metalness:.64, roughness:.21, envMapIntensity:1.4});

                for (let i = 0; i < number; i++) {

                        const innerLight = green && Math.hypot(onTree.x,onTree.z) < radius * .7;
                        const tone = innerLight ? (i % 3 ? 0xc5ee53 : 0xfff5a6) : green ? palette[i % palette.length] : palette[i % 7 < 4 ? 0 : 1];
                        batch.setColorAt(i,new THREE.Color(tone));
                        size = (.20 + Math.random() * .19) * (IS_MOBILE ? 1.19 : 1);
                    } else {
                        const tone = green ? balls[i % balls.length] : balls[i % 27 < 22 ? 0 : 1];
                        batch.setColorAt(i,new THREE.Color(tone));
                        size = green ? .37 + .36 * Math.random() : .42 + .48 * Math.random();
                    }
                    parts.push({onTree,loose,size});
                }
                mainGroup.add(batch);
                treeBatches.push({batch,parts,spheres:true,lastMix:null});
            }
            if (green) createPlanets();

            const outline = new THREE.Shape();
            for (let i = 0; i < 10; i++) {
                const a = Math.PI / 2 + i * Math.PI / 5;
                const radius = i % 2 ? .46 : 1.05;
                const x = Math.cos(a) * radius, y = Math.sin(a) * radius;

            starShape.center();

            }));

        function createPlanets() {
            const tones = [0xffd56e,0x94c1ff,0xe7507d,0xd92f54,0xef83ae,0x85a8ff];
            const cores = [], rings = [];
            const sphere = new THREE.SphereGeometry(.5,32,30);
            const coordinates = sphere.getAttribute('position');
            const bands = new Float32Array(coordinates.count * 3);
            for (let i = 0; i < coordinates.count; i++) {

                const wave = .055 * Math.sin(7 * coordinates.getX(i)) + .04 * Math.sin(8 * coordinates.getZ(i));

        function createDust() {

                pickParticlePositions(treePoint,loosePoint,true);
                treePoint.toArray(positions,i * 3);

                const j = i % 10;
                const tone = green ? palette[j < 8 ? j % 4 : j - 4] : palette[i % 2];
                new THREE.Color(tone).toArray(colors,i * 3);
                phase[i] = Math.random();

            geometry.setAttribute('position', new THREE.BufferAttribute(positions,3));

            mainGroup.add(treeGlints);

        function updateTreeGraphics(dt, elapsed) {
            const target = STATE.mode === 'TREE' ? 0 : 1;
            scatterMix = THREE.MathUtils.damp(scatterMix,target,4.4,dt);
            if (Math.abs(scatterMix - target) < .0005) scatterMix = target;
            const scale = renderer.domElement.height * .5 * camera.projectionMatrix.elements[5];
            for (const group of treeBatches) {
                const {batch, parts, spheres} = group;
                // Round beads keep their local pose when only the whole tree rotates.
                if (spheres && group.lastMix === scatterMix) continue;
                if (spheres) instancePose.rotation.set(0,0,0);
                for (let i = 0; i < parts.length; i++) {
                    const p = parts[i];
                    instancePose.position.lerpVectors(p.onTree,p.loose,scatterMix);
                    if (!spheres) {
                        instancePose.rotation.set(p.tilt,.10 * Math.sin(elapsed * .45 + p.phase),p.slant,'ZXY');
                    }
                    instancePose.scale.setScalar(p.size);
                    instancePose.updateMatrix();
                    batch.setMatrixAt(i,instancePose.matrix);
                }
                batch.instanceMatrix.needsUpdate = true;
                if (spheres) group.lastMix = scatterMix;
            }
            if (treeGlints) {
                const u = treeGlints.material.uniforms;
                u.time.value = elapsed; u.mixAmount.value = scatterMix; u.projectionScale.value = scale;
            }
            if (snowField) {
                snowField.visible = scatterMix < .98;
                snowField.material.uniforms.travel.value += dt * CONFIG.snow.speed;
                snowField.material.uniforms.projectionScale.value = scale;
            }
            if (treeStar) treeStar.scale.setScalar(1 - scatterMix);
        }

        function rebuildTree() {

        function createPhotoTexture(b,id){
            const img=new Image();

            img.onload=()=>{
                try{

                    // 再交给 WebGL，避免不同来源图片出现偏色 / 过饱和 / 发灰。
                    const MAX=1024;
                    const ow=img.naturalWidth||img.width||1, oh=img.naturalHeight||img.height||1;
                    const k=Math.min(1, MAX/Math.max(ow,oh));
                    const w=Math.max(2,Math.round(ow*k)), h=Math.max(2,Math.round(oh*k));
                    const cv=document.createElement('canvas'); cv.width=w; cv.height=h;
                    const cx=cv.getContext('2d',{colorSpace:'srgb',alpha:false,imageSmoothingQuality:'high'});
                    cx.imageSmoothingEnabled=true; cx.imageSmoothingQuality='high';
                    cx.fillStyle='#000'; cx.fillRect(0,0,w,h);
                    cx.drawImage(img,0,0,w,h);
                    const t=new THREE.CanvasTexture(cv);
                    t.colorSpace=THREE.SRGBColorSpace;
                    t.magFilter=THREE.LinearFilter;
                    t.minFilter=THREE.LinearMipmapLinearFilter;
                    t.generateMipmaps=true;
                    t.anisotropy=Math.min(8, renderer&&renderer.capabilities?renderer.capabilities.getMaxAnisotropy():1);
                    t.needsUpdate=true;
                    addPhotoToScene(t,id,{width:w,height:h});

                    const t=new THREE.Texture(img); t.colorSpace=THREE.SRGBColorSpace; t.needsUpdate=true; addPhotoToScene(t,id,img);
                }
            };
            img.onerror=()=>console.warn('photo decode failed',id);
            img.src=b;
        }
        function addPhotoToScene(t,id,imgObj){

            idle:'摄像头未启动', requesting:'正在连接摄像头…', loading:'正在加载手势识别…',
            live:'手势识别已就绪', denied:'摄像头权限被拒', busy:'摄像头被其他页面占用',
            'no-device':'未找到可用摄像头', ended:'摄像头已断开', error:'摄像头异常',
            'model-error':'手势识别暂不可用，请检查网络后重试'
        };
        function camHint() {
            if (CAM_STATE === 'live') return STATE.hand.detected ? ' · 手势识别中' : ' · 等待手势';
            return CAM_STATE === 'idle' ? '' : ' · ' + cameraMessages[CAM_STATE];
        }
        function setCamState(state, detail) {
            CAM_STATE = window.CAM_STATE = state;
            const busy = state === 'requesting' || state === 'loading';
            const active = state === 'live';
            const dot = document.getElementById('cam-status');
            if (dot) {
                dot.classList.toggle('active', active);
                const color = active ? '#00ff00' : busy ? '#ffcc00' : '#ff3333';
                dot.style.background = color;
                dot.style.boxShadow = '0 0 6px ' + color;
            }
            const msg = document.getElementById('cam-msg');
            if (msg) msg.textContent = cameraMessages[state] + (detail ? '：' + detail : '');
            const retry = document.getElementById('cam-retry');
            if (retry) retry.classList.toggle('show', !busy && !active && state !== 'idle');
            const button = document.getElementById('gesture-control');
            if (button) {
                button.disabled = busy || active;
                button.textContent = active ? '手势已开启' : busy ? cameraMessages[state] : state === 'idle' ? '开启手势' : '重试手势';
                button.title = msg?.textContent || cameraMessages[state];
            }
            refreshHint();
        }
        function stopCamera() {
            cameraSession++;
            cancelAnimationFrame(cameraFrame);
            camStream?.getTracks().forEach(track => track.stop());
            camStream = null;
            if (videoElement) videoElement.srcObject = null;
            handLandmarker?.close();
            handLandmarker = null;
            STATE.hand.detected = false;
        }
        async function startAuthorizedCamera() {
            const session = cameraSession;
            try {
                const access = await navigator.permissions?.query({name:'camera'});
                if (session === cameraSession && access?.state === 'granted' && CAM_STATE === 'idle') initMediaPipe();
            } catch (_) { /* Browsers without a camera permission query use the button. */ }
        }
        async function initMediaPipe() {
            if (['requesting', 'loading', 'live'].includes(CAM_STATE)) return;
            if (!navigator.mediaDevices?.getUserMedia) { setCamState('no-device'); return; }
            const session = ++cameraSession;
            setCamState('requesting');
            try {
                const stream = await navigator.mediaDevices.getUserMedia({video:{
                    facingMode:'user', width:{ideal:640}, height:{ideal:480}, frameRate:{ideal:30}
                }, audio:false});
                if (session !== cameraSession) {
                    stream.getTracks().forEach(track => track.stop());
                    return;
                }
                camStream = stream;
                videoElement = document.getElementById('webcam-video');
                videoElement.srcObject = stream;
                stream.getVideoTracks()[0]?.addEventListener('ended', () => {
                    if (session !== cameraSession) return;
                    stopCamera();
                    setCamState('ended');
                }, {once:true});
                await videoElement.play();
                if (session !== cameraSession) return;
            } catch (e) {
                if (session !== cameraSession) return;
                stopCamera();
                const error = e.name;
                if (['NotAllowedError','SecurityError','PermissionDeniedError'].includes(error)) {
                    setCamState('denied','请在浏览器地址栏允许访问摄像头');
                } else if (['NotReadableError','TrackStartError','AbortError'].includes(error)) {
                    setCamState('busy');
                    const failedSession = cameraSession;
                    setTimeout(() => { if (failedSession === cameraSession && CAM_STATE === 'busy') initMediaPipe(); }, 4000);
                } else if (['NotFoundError','DevicesNotFoundError','OverconstrainedError'].includes(error)) {
                    setCamState('no-device');
                } else setCamState('error',error);
                return;
            }

            setCamState('loading');
            try {
                const assets = 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3';
                const url = assets + '/+esm' + (importAttempt ? '?retry=' + importAttempt : '');
                let vision;
                try { vision = await import(url); }
                catch (error) { importAttempt++; throw error; }
                if (session !== cameraSession) return;
                const files = await vision.FilesetResolver.forVisionTasks(assets + '/wasm');
                if (session !== cameraSession) return;
                const createModel = delegate => vision.HandLandmarker.createFromOptions(files, {
                    baseOptions:{modelAssetPath:'https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task',delegate},
                    runningMode:'VIDEO', numHands:1
                });
                let model;
                try { model = await createModel('GPU'); }
                catch (e) {
                    if (session !== cameraSession) return;
                    console.warn('GPU hand tracking unavailable',e);
                    model = await createModel('CPU');
                }
                if (session !== cameraSession) { model.close(); return; }
                handLandmarker = model;
                setCamState('live');
                startCameraFrames(session);
            } catch (e) {
                if (session !== cameraSession) return;
                stopCamera();
                setCamState('model-error');
                console.warn('hand model unavailable',e);
            }
        }
        window.enableGestures = initMediaPipe;
        document.getElementById('cam-retry')?.addEventListener('click', initMediaPipe);
        window.addEventListener('pagehide', () => {
            restoreCamera = CAM_STATE === 'loading' || CAM_STATE === 'live';
            stopCamera();
            setCamState('idle');
        });
        window.addEventListener('pageshow', e => {
            if (!e.persisted) return;
            if (restoreCamera) initMediaPipe();
            else startAuthorizedCamera();
        });
        function startCameraFrames(session) {
            const canvas = document.getElementById('webcam-canvas');
            const context = canvas.getContext('2d');
            let lastTime = -1, lastDetect = -Infinity;
            function frame(now) {
                if (session !== cameraSession) return;
                if (videoElement.readyState >= 2 && videoElement.currentTime !== lastTime && now - lastDetect >= (IS_MOBILE ? 70 : 33)) {
                    lastTime = videoElement.currentTime;
                    lastDetect = now;
                    try {
                        if (STATE.cameraVisible) context?.drawImage(videoElement,0,0,canvas.width,canvas.height);
                        processGestures(handLandmarker.detectForVideo(videoElement,now));
                        refreshHint();
                        document.getElementById('cam-status').classList.toggle('active', STATE.hand.detected);
                    } catch (e) {
                        stopCamera();
                        setCamState('model-error');
                        console.warn('hand detection failed',e);
                        return;
                    }
                }
                cameraFrame = requestAnimationFrame(frame);
            }
            cameraFrame = requestAnimationFrame(frame);
        }
        function processGestures(result) {
            const screenHand = result.landmarks?.[0];
            STATE.hand.detected = Boolean(screenHand);
            if (!screenHand) return;
            STATE.hand.x = (screenHand[9].x - 0.5) * 2;
            STATE.hand.y = (screenHand[9].y - 0.5) * 2;

            const worldHand = result.worldLandmarks?.[0];
            const points = worldHand || screenHand;
            const aspect = worldHand ? 1 : (videoElement?.videoWidth / videoElement?.videoHeight || 1);
            const distance = (i, j) => Math.hypot((points[i].x - points[j].x) * aspect,
                points[i].y - points[j].y, worldHand ? points[i].z - points[j].z : 0);
            const palmLength = distance(0, 9);
            if (palmLength < 0.0001) return;

            let folded = 0, extended = 0;
            for (const tip of [8, 12, 16, 20]) {
                const reach = distance(0, tip) / distance(0, tip - 2);
                if (reach < 1.02) folded++;
                if (reach > 1.14) extended++;
            }
            const pinch = distance(4, 8) / palmLength;
            if (folded >= 3) {
                if (STATE.mode !== 'TREE') setMode('TREE');
            } else if (STATE.mode === 'FOCUS') {
                if (pinch > 0.55) setMode('SCATTER');
            } else if (pinch < 0.28 && photoMeshGroup.children.length) {
                triggerPhotoGrab();
            } else if (extended >= 3 && STATE.mode !== 'SCATTER') {
                setMode('SCATTER');
            }
        }

        window.setupEvents=()=>{
            window.addEventListener('resize', () => {
                const zoom = camera.position.z / Math.max(CONFIG.camera.z, 23.2 / camera.aspect);
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.position.z = Math.max(CONFIG.camera.z, 23.2 / camera.aspect) * zoom;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
                composer.setSize(window.innerWidth, window.innerHeight);
            });
            document.getElementById('file-input').addEventListener('change',e=>{Array.from(e.target.files).forEach(f=>{const r=new FileReader();r.onload=ev=>{const i=new Image();i.src=ev.target.result;i.onload=()=>{const id=savePhotoToDB(ev.target.result);createPhotoTexture(ev.target.result,id)}};r.readAsDataURL(f)})});
            document.getElementById('music-input').addEventListener('change',e=>{const f=e.target.files[0];if(f){saveMusicToDB(f);bgmAudio.src=URL.createObjectURL(f);bgmAudio.play().then(()=>{isMusicPlaying=true;updatePlayBtnUI(true)}).catch(console.error)}});
            
            // 键盘交互
window.addEventListener('keydown', (e) => {
                if (e.target.closest('input, select, button, summary, a, textarea')) return;
                const code = e.code;
                const k = e.key.toLowerCase();
                
                if (k === 'h') window.toggleUI();
                if (code === 'Space') { e.preventDefault(); setMode('TREE'); }
                if (k === 'z') setMode('SCATTER');
                if (k === 'x') triggerPhotoGrab();

                if (code === 'ArrowUp') manualRotateState.x = -1;
                if (code === 'ArrowDown') manualRotateState.x = 1;
                if (code === 'ArrowLeft') manualRotateState.y = -1;
                if (code === 'ArrowRight') manualRotateState.y = 1;
            });
            window.addEventListener('keyup', (e) => {
                const code = e.code;
                if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(code)) manualRotateState = { x: 0, y: 0 };
            });
        }
        window.openDeleteManager=async()=>{document.getElementById('delete-manager').classList.remove('hidden');const g=document.getElementById('photo-grid');g.innerHTML='';const ps=await loadPhotosFromDB();if(!ps||ps.length===0)g.innerHTML='<div style="color:#888;">暂无照片</div>';else ps.forEach(p=>{const d=document.createElement('div');d.className='photo-item';const i=document.createElement('img');i.className='photo-thumb';i.src=p.data;const b=document.createElement('div');b.className='delete-x';b.innerText='X';b.onclick=e=>{e.stopPropagation();confirmDelete(p.id,d)};d.appendChild(i);d.appendChild(b);g.appendChild(d)})}
        window.confirmDelete=(id,el)=>{deletePhotoFromDB(id);el.remove();const p=particleSystem.find(pa=>pa.photoId===id);if(p){photoMeshGroup.remove(p.mesh);particleSystem.splice(particleSystem.indexOf(p),1)}}
        window.clearAllPhotos=()=>{if(confirm("确定要清空所有照片吗？")){clearPhotosDB();particleSystem.filter(p=>p.type==='PHOTO').forEach(p=>photoMeshGroup.remove(p.mesh));particleSystem=particleSystem.filter(p=>p.type!=='PHOTO');window.openDeleteManager()}}
        window.closeDeleteManager=()=>{document.getElementById('delete-manager').classList.add('hidden')}

        function animate() {
            requestAnimationFrame(animate); const dt=Math.min(clock.getDelta(),0.05); const et=clock.getElapsedTime();

            // Updated Rotation Logic
if(manualRotateState.x!==0||manualRotateState.y!==0){const s=CONFIG.interaction.rotationSpeed*2.0;STATE.rotation.x+=manualRotateState.x*s*dt;STATE.rotation.y+=manualRotateState.y*s*dt;}
            else if(STATE.mode==='SCATTER'&&STATE.hand.detected){const th=0.3,s=CONFIG.interaction.rotationSpeed;if(STATE.hand.x>th)STATE.rotation.y-=s*dt*(STATE.hand.x-th);else if(STATE.hand.x<-th)STATE.rotation.y-=s*dt*(STATE.hand.x+th);if(STATE.hand.y<-th)STATE.rotation.x+=s*dt*(-STATE.hand.y-th);else if(STATE.hand.y>th)STATE.rotation.x-=s*dt*(STATE.hand.y-th);}
            else{if(STATE.mode==='TREE'){STATE.rotation.y+=0.3*dt;STATE.rotation.x+=(0-STATE.rotation.x)*2.0*dt;}else STATE.rotation.y+=0.1*dt;}
            
            mainGroup.rotation.y=STATE.rotation.y;mainGroup.rotation.x=STATE.rotation.x;
            updateTreeGraphics(dt,et);
            particleSystem.forEach(p=>p.update(dt,STATE.mode,STATE.focusTarget));
            composer.render();
        }
        // ================= 移动端运行时 (v17.6.5-m) =================
        const IS_MOBILE = (window.matchMedia && (window.matchMedia('(max-width: 760px)').matches || window.matchMedia('(hover: none) and (pointer: coarse)').matches)) || /Android|iPhone|iPad|iPod|HarmonyOS|Mobile/i.test(navigator.userAgent);
        window.IS_MOBILE = IS_MOBILE;
        document.getElementById('left-sidebar').append(document.querySelector('.bottom-left-panel'));
        if (IS_MOBILE) {
            CONFIG.particles.count = 2100;
            CONFIG.particles.dustCount = 1000;
            CONFIG.snow.count = 200;
            const setSlider = (id, v, max) => { const el = document.getElementById(id); if (el) { if (max) el.max = max; el.value = v; } };
            setSlider('slider-tree', CONFIG.particles.count, 4000);
            setSlider('slider-dust', 1000, 2500);
            setSlider('slider-snow-count', 200, 1500);

            document.querySelectorAll('button.elegant-btn').forEach(b => {
                if (!/\((SPACE|Z|X)\)/i.test(b.textContent || '')) return;
                b.textContent = b.textContent.replace(/\s*\((SPACE|Z|X)\)/gi, '').trim();
            });
            document.addEventListener('dblclick', e => e.preventDefault(), { passive: false });
        }

        window.toggleFullScreen = function () {
            const el = document.documentElement;
            const req = el.requestFullscreen || el.webkitRequestFullscreen;
            const exit = document.exitFullscreen || document.webkitExitFullscreen;
            const active = document.fullscreenElement || document.webkitFullscreenElement;
            if (!active) {
                if (!req) { window.toggleUI(); return; }
                try { const p = req.call(el); if (p && p.catch) p.catch(() => window.toggleUI()); } catch (err) { window.toggleUI(); }
            } else if (exit) { try { exit.call(document); } catch (err) {} }
        };

        (function mobileInput() {
            const surface = document.getElementById('canvas-container');
            if (surface) {
                surface.style.touchAction = 'none';
                const ptrs = new Map();
                let tapOrigin = null;
                const toggleShape = () => window.setMode(STATE.mode === 'TREE' ? 'SCATTER' : 'TREE');
                surface.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); e.stopPropagation(); toggleShape(); } });
                surface.addEventListener('pointerdown', e => { tapOrigin = e.isPrimary && e.button === 0 ? {x:e.clientX,y:e.clientY} : null; });
                surface.addEventListener('pointermove', e => { if (tapOrigin && Math.hypot(e.clientX-tapOrigin.x,e.clientY-tapOrigin.y)>8) tapOrigin=null; });
                surface.addEventListener('pointerup', () => { if (tapOrigin && ptrs.size === 1) toggleShape(); tapOrigin=null; });
                surface.addEventListener('pointercancel', () => { tapOrigin=null; });
                let pinch = 0;
                surface.addEventListener('pointerdown', e => { ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY }); try { surface.setPointerCapture(e.pointerId); } catch (_) {} });
                surface.addEventListener('pointermove', e => {
                    const p = ptrs.get(e.pointerId); if (!p) return;
                    const dx = e.clientX - p.x, dy = e.clientY - p.y; p.x = e.clientX; p.y = e.clientY;
                    if (ptrs.size === 1) {
                        STATE.rotation.y += dx * 0.006;
                        STATE.rotation.x = Math.max(-1.0, Math.min(1.0, STATE.rotation.x + dy * 0.004));
                        manualRotateState = { x: 0, y: 0 };
                    } else if (ptrs.size === 2) {
                        const a = [...ptrs.values()];
                        const d = Math.hypot(a[0].x - a[1].x, a[0].y - a[1].y);
                        if (pinch && camera) camera.position.z = Math.max(26, Math.min(88, camera.position.z - (d - pinch) * 0.22));
                        pinch = d;
                    }
                }, { passive: true });
                const release = e => { ptrs.delete(e.pointerId); if (ptrs.size < 2) pinch = 0; };
                ['pointerup', 'pointercancel', 'pointerleave'].forEach(n => surface.addEventListener(n, release));
            }

            document.querySelectorAll('.dir-btn[onmousedown]').forEach(el => {
                const m = (el.getAttribute('onmousedown') || '').match(/startRotate\('(\w+)'\)/);
                if (!m) return;
                const dir = m[1];
                el.onmousedown = null; el.onmouseup = null; el.onmouseleave = null;
                el.addEventListener('pointerdown', ev => { ev.preventDefault(); window.startRotate(dir); });
                ['pointerup', 'pointercancel', 'pointerleave'].forEach(n => el.addEventListener(n, () => window.stopRotate()));
            });

            const bind = (id, fn) => { const el = document.getElementById(id); if (el) el.addEventListener('click', fn); };
            bind('mb-tree', () => window.setMode('TREE'));
            bind('mb-scatter', () => window.setMode('SCATTER'));
            bind('mb-grab', () => window.triggerPhotoGrab());
            bind('mb-cam', () => window.toggleCameraDisplay());
            bind('mb-settings', () => window.toggleUI());

            const unlock = () => {
                if (bgmAudio && bgmAudio.src) bgmAudio.play().then(() => { isMusicPlaying = true; updatePlayBtnUI(true); }).catch(() => {});
                document.removeEventListener('pointerdown', unlock);
            };
            document.addEventListener('pointerdown', unlock);
        })();

        init();
    </script>

        <summary class="elegant-btn glass-panel">♫ 心跳的证明</summary>

            <iframe title="刘人语《心跳的证明》Apple Music 播放器"
                src="https://embed.music.apple.com/hk/album/1452981078?i=1452981267&amp;theme=dark"
                loading="lazy"
                allow="autoplay; encrypted-media; clipboard-write"
                sandbox="allow-forms allow-popups allow-popups-to-escape-sandbox allow-same-origin allow-scripts allow-storage-access-by-user-activation allow-top-navigation-by-user-activation"></iframe>
            <a class="elegant-btn song-link" href="https://www.youtube.com/watch?v=5xDFEP9_GCk" target="_blank" rel="noopener noreferrer">观看官方完整版 MV</a>
        </div>
